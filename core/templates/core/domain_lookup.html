{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'core/img/favicon.ico' %}">
    <title>AVERON - Domain Lookup</title>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <section class="hero lookup-hero">
        <span class="hero-tag">DOMAIN LOOKUP</span>
        <h1>Investigate a website domain.</h1>
        <p class="hero-desc">Get publicly available information.</p>
    </section>

    <section class="lookup-wrap">
        <form class="lookup-form" id="lookupForm">
            <div class="lookup-input-row">
                <input type="text" name="query" id="lookupInput" class="lookup-input" placeholder="target.com" autocomplete="off">
                <button type="submit" class="lookup-input-arrow" aria-label="Lookup">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <button type="submit" class="lookup-submit">Lookup</button>
        </form>

        <div class="lookup-status" id="lookupStatus"></div>

        <div class="lookup-result" id="lookupResult" hidden>
            <div class="lookup-result-head">
                <span>Result</span>
            </div>
            <div class="lookup-result-table" id="lookupResultTable"></div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-left">
            <a href="/" class="footer-author-link">Home</a>
            <a href="/about" class="footer-author-link">About</a>
        </div>

        <div class="footer-center">
            <span>AVERON · Built for responsible OSINT research</span>
        </div>

        <div class="footer-right">
            <a href="/start" class="footer-author-link">Start</a>
            <a href="https://github.com/AmirCyberSecurity" target="_blank" class="footer-author-link">GitHub</a>
        </div>
    </footer>

    <script src="{% static 'core/js/domain_lookup.js' %}"></script>
</body>
</html>
